# Ao criar uma tag de versão (ex.: v1.8.0): roda os testes, constrói a imagem para amd64 e arm64 e publica no GitHub Container Registry.
name: Publicar imagem

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      criar_release_da_tag:
        description: "Só cria a Release (sem rebuild) para uma tag que já existe, ex.: v1.9.0"
        required: false
        default: ""

permissions:
  contents: write
  packages: write

jobs:
  testes:
    if: ${{ github.event.inputs.criar_release_da_tag == '' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fin_owner
          POSTGRES_PASSWORD: owner_dev
          POSTGRES_DB: financas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fin_owner -d financas_test" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: backend

  imagem:
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: A tag precisa coincidir com o arquivo VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [imagem]
    if: ${{ always() && (needs.imagem.result == 'success' || github.event.inputs.criar_release_da_tag != '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.criar_release_da_tag || github.ref }}
      - name: Criar a Release com as notas do CHANGELOG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.criar_release_da_tag || github.ref_name }}
        run: |
          versao="${TAG#v}"
          awk -v v="$versao" '/^## /{ if (achou) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) { achou=1; next } } achou' CHANGELOG.md > notas.md
          test -s notas.md || { echo "Sem notas para $versao no CHANGELOG.md"; exit 1; }
          {
            echo
            echo "Imagem: \`ghcr.io/${GITHUB_REPOSITORY}:${versao}\`"
          } >> notas.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file notas.md
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notas.md
          fi
